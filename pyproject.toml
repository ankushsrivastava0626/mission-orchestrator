[project]
name = "mission-orchestrator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.27,<2",
  "httpx>=0.27",
  "click>=8.1",
]

[project.scripts]
orchd = "orch.cli:daemon_main"
orchctl = "orch.cli:ctl_main"
orch-mcp = "orch.mcp_server:main"
msec = "orch.cli:msec_main"
owatch = "orch.cli:owatch_main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orch*"]
